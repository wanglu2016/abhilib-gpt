<!DOCTYPE html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f9f6ed"><title>毗昙库 AbhiLib · 证明工作台</title>
<style>
:root{--paper:#f8f5eb;--ink:#242c2b;--muted:#5c6662;--line:#c8c6b9;--red:#963d2d;--teal:#195b52;--serif:"Noto Serif CJK SC","Songti SC","STSong",Georgia,serif;--sans:"Instrument Sans",-apple-system,"Noto Sans CJK SC","Microsoft YaHei",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.65 var(--sans)}header{border-bottom:1px solid var(--line)}.bar,main,footer{max-width:1140px;margin:auto;padding:0 34px}.bar{display:flex;align-items:center;gap:22px;min-height:75px}.brand{display:flex;align-items:center;gap:10px;font:bold 22px var(--serif);color:var(--ink)}.seal{display:grid;place-items:center;background:var(--red);color:#fff;padding:3px 7px;font-family:var(--serif)}.latin{font:italic 17px Georgia;color:#57615b}.nav{margin-left:auto;display:flex;gap:16px;align-items:center}.nav a{font-size:14px;color:var(--ink)}a{color:var(--teal);text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:3px}button,select,input{font:inherit;color:var(--ink)}button,select{cursor:pointer}button,.btn{background:transparent;border:1px solid var(--line);border-radius:3px;padding:7px 14px}.btn{display:inline-block;text-decoration:none}.primary{background:var(--teal);color:white;border-color:var(--teal)}:focus-visible{outline:3px solid #b57944;outline-offset:3px}main{padding-top:38px;padding-bottom:56px;min-height:74vh}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:52px;align-items:center;padding:16px 0 40px}.kicker,.num{font:12px/1.5 ui-monospace,monospace;letter-spacing:.08em;color:var(--red)}h1,h2,h3,blockquote{font-family:var(--serif)}h1{font-size:clamp(35px,4.9vw,63px);line-height:1.23;margin:14px 0 20px;letter-spacing:-.04em}h2{font-size:29px;line-height:1.45;margin:22px 0 15px}h3{font-size:21px;line-height:1.45;margin:7px 0 12px}p{margin:10px 0 19px}.lead{font-size:18px;color:var(--muted);max-width:43em}.actions,.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.plate,.panel{border:1px solid var(--line);padding:22px 24px;background:#fcfaf2}.plate{border-top:4px solid var(--teal)}.plate a,.item{display:block;border-top:1px solid var(--line);padding:11px 0;color:var(--ink)}.plate small,.hint{color:var(--muted)}.band{border-top:1px solid var(--ink);padding-top:4px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.grid .panel{display:block;color:var(--ink)}.grid .panel:hover{border-color:var(--teal)}.layout{display:grid;grid-template-columns:minmax(0,1.8fr) minmax(230px,.8fr);gap:24px}.narrow{max-width:780px}.chip{background:#eeeee2;border:1px solid var(--line);padding:4px 9px;font-size:13px;color:var(--teal);border-radius:3px}.note{border-left:3px solid var(--red);padding:8px 16px;background:#f1ebe0}.list{padding:0}.item strong{margin:0 12px 0 0}.item span{display:inline-block;min-width:55px}.ctrl{padding:9px 12px;background:#fffdf5;border:1px solid var(--line);max-width:100%;border-radius:3px}.lookup{width:min(100%,480px)}.filters{display:flex;gap:9px;flex-wrap:wrap;margin:18px 0}.option{display:block;margin:10px 0}.option input{accent-color:var(--teal);width:18px;height:18px;vertical-align:middle}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#27342e;color:#f2f0e4;padding:18px;border-radius:4px;font:13px/1.65 ui-monospace,monospace}blockquote{margin:14px 0;font-size:24px}details{margin:14px 0}summary{cursor:pointer;color:var(--teal)}.pager{display:flex;justify-content:space-between;margin-top:20px}.crumb{font-size:14px;color:var(--muted)}.result{background:#e6eee4;border-top:3px solid var(--teal);padding:17px}.bad{background:#f3e5d9;border-color:var(--red)}.scroll{max-height:61vh;overflow:auto}.rowlinks{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.rowlinks a{text-align:center;padding:3px;border:1px solid var(--line);font:13px/1.8 monospace}.rowlinks a[aria-current]{background:var(--teal);color:white}footer{padding-top:17px;padding-bottom:25px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}@media(max-width:760px){.bar,main,footer{padding-left:18px;padding-right:18px}.bar{align-items:flex-start;gap:6px;flex-direction:column;padding-top:10px;padding-bottom:8px}.nav{margin:0;width:100%;gap:13px;flex-wrap:wrap}.nav button{padding:2px 6px;font-size:13px}.hero,.layout,.grid{grid-template-columns:1fr;gap:15px}.hero{padding-top:0}.plate,.panel{padding:15px}.hero h1{font-size:40px}main{padding-top:24px}.rowlinks{grid-template-columns:repeat(8,1fr)}}
</style></head><body><header><div class="bar"><a class="brand" href="#home"><span class="seal">毘</span><span id="brand">毗昙库</span><span class="latin">AbhiLib</span></a><nav class="nav" id="nav"></nav></div></header><main id="app"></main><footer id="foot"></footer>
<script>
const DATA=/*:DATA:*/;
const entries=DATA.entries, repo="https://github.com/wanglu2016/abhilib-gpt";
let trad=true;try{trad=localStorage.getItem("abhi-script")!=="s"}catch{}
const el=id=>document.getElementById(id), esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])), simple=s=>Array.from(s,c=>DATA.translation[c]||c).join(""), f=s=>esc(trad?s:simple(s)), link=(id,label,cl="")=>'<a class="'+cl+'" href="#'+esc(id)+'">'+f(label)+'</a>', go=(id,cl="chip")=>link(id,id+" "+entries[id].title.replace(/。$/,""),cl);
const groupName={steps:"文章步驟",premises:"原文前提",bridges:"橋接條件",entries:"定理與模型",concepts:"概念",sources:"文獻",rules:"論書規則與分類",topics:"命題導讀"};
const sections=[[1,14,"從見斷心找到相應惑"],[15,22,"由內門排除親發表業"],[23,33,"排除欲界有覆表"],[34,38,"限定表業的繫地"],[39,48,"從有覆色推到有覆表"]];
const sid=n=>"S"+String(n).padStart(2,"0"), chips=ids=>'<div class="chips">'+ids.map(x=>go(x)).join("")+'</div>';
function home(){return '<section class="band"><h2>'+f("命題導讀")+'</h2>'+chips(Object.keys(entries).filter(id=>entries[id].group==="topics"))+'</section>'+'<section class="hero"><div><span class="kicker">ABHILIB / '+f("業品 · 證明工作台")+'</span><h1>'+f("有覆無記色，")+'<br>'+f("何以唯初靜慮繫？")+'</h1><p class="lead">'+f("從王路的一篇毘曇推導出發，逐句對照原文與 Lean 證明，再抽去前提，看哪些結論還能成立。")+'</p><div class="actions">'+link("S01","逐步讀證明 →","btn primary")+link("lab","試著撤去前提","btn")+'</div></div><aside class="plate"><h3>'+f("原文的五段推導")+'</h3>'+sections.map(([a,b,s])=>link(sid(a),sid(a)+"–"+sid(b)+"　"+s)).join("")+'</aside></section><div class="band"><h2>'+f("同一命題，三條證明路徑")+'</h2><div class="grid">'+[["T02","證明一 · 讀「得」","《順正理論》的句子如何從得指回所得法？"],["T03","證明二 · 從表到色","原典只說有覆表。哪一步把範圍擴展到一切有覆色？"],["T01","證明三 · 由前提演繹","檢查十六條前提、四十八步與五項明示的橋接。"]].map(([id,t,n])=>'<a class="panel" href="#'+id+'"><span class="num">'+id+'</span><h3>'+f(t)+'</h3>'+f(n)+'</a>').join("")+'</div></div><h2>'+f("從哪裡開始審讀？")+'</h2>'+chips(["S46","T04","T06","T15","T19"])}
function index(){return '<span class="kicker">CATALOGUE</span><h1>'+f("研究索引")+'</h1><div class="filters"><input class="ctrl lookup" id="search" type="search" aria-label="'+f("搜尋")+'" placeholder="'+f("搜尋編號、術語、前提或原句")+'"><select class="ctrl" id="group" aria-label="'+f("條目類型")+'"><option value="">'+f("全部類型")+'</option>'+Object.entries(groupName).map(([k,v])=>'<option value="'+k+'">'+f(v)+'</option>').join("")+'</select></div><div class="hint" id="total"></div><div class="list" id="results"></div>'}
function filter(){const q=simple(el("search").value.trim()).toLowerCase(), group=el("group").value, rows=Object.values(entries).filter(e=>(!group||e.group===group)&&simple([e.id,e.title,e.note||"",e.verse||"",e.decl||""].join(" ")).toLowerCase().includes(q));el("total").textContent=rows.length+" "+(trad?"條":"条");el("results").innerHTML=rows.map(e=>'<a class="item" href="#'+e.id+'"><span class="num">'+e.id+'</span><strong>'+f(e.title)+'</strong><small>'+f(groupName[e.group])+'</small></a>').join("")}
function sectionNav(current){return '<aside class="panel"><h3>'+f("五段推導")+'</h3>'+sections.map(([a,b,s])=>'<p>'+f(s)+'</p><div class="rowlinks">'+Array.from({length:b-a+1},(_,i)=>{let id=sid(i+a);return '<a href="#'+id+'" '+(id===current?'aria-current="step"':'')+'>'+id+'</a>'}).join("")+'</div>').join("")+'</aside>'}
function detail(e){let refs=e.refs||[], calls=e.calls||[],params=(e.parameters||[]).filter(x=>x[0]==="P"||x[0]==="B"||x[0]==="H");let s='<div class="crumb">'+link("index","研究索引")+'　/　'+f(groupName[e.group])+'</div><div class="kicker" style="margin-top:22px">'+e.id+'</div><h1 style="font-size:clamp(28px,4vw,46px)">'+f(e.title)+'</h1>';s+='<div class="layout"><article class="panel">';
 if(e.group==="steps"||e.group==="premises")s+='<div class="hint">'+f("王路原文 · 2022年7月")+'</div><blockquote>'+esc(e.title)+'</blockquote>';
 if(e.role)s+='<p class="hint">'+f(e.role)+'</p>';if(e.note)s+='<p class="note">'+f(e.note)+'</p>';if(e.verse)s+='<h3>'+f("作者所附相關頌")+'</h3><blockquote>'+esc(e.verse)+'</blockquote><p class="hint">'+f("原作者只標示關聯。逐條義理解讀仍可修訂。")+'</p>';
 if(refs.length)s+='<h3>'+f(e.group==="steps"?"原文所引":e.group==="bridges"?"使用位置":e.group==="topics"?"沿證明閱讀":"對讀條目")+'</h3>'+chips(refs);
 if(e.locator)s+='<p>'+f(e.locator)+'</p><a class="btn" href="'+esc(e.url)+'">'+f("打開來源 ↗")+'</a>';
 if(e.decl){s+='<h3>'+f("形式化驗證")+'</h3><p><span class="num">Lean 4.19.0</span>　'+f(e.group==="rules"?"規則表述已編譯 · 依據見文獻":"已編譯 · 義理待審")+'</p>';if(params.length)s+='<p class="hint">'+f("聲明中出現的領域前提")+'</p>'+chips(params);if(calls.length)s+='<p class="hint">'+f("證明項直接引用的已編號聲明")+'</p>'+chips(calls);s+='<details><summary>'+f("查看 Lean 原碼與全局公理")+'</summary><pre>'+esc(e.code)+'</pre><p class="hint">'+f("全局公理")+"　"+esc(e.axioms.join(", ")||"∅")+'　·　<a href="'+e.src+'">GitHub ↗</a></p></details>'}
 let back=Object.values(entries).filter(x=>(x.refs||[]).includes(e.id)&&x.group==="concepts");if(back.length)s+='<h3>'+f("相關概念")+'</h3>'+chips(back.map(x=>x.id));
 if(e.group==="steps"){let n=+e.id.slice(1);s+='<div class="pager">'+(n>1?link(sid(n-1),"← 上一步"):"<i></i>")+(n<48?link(sid(n+1),"下一步 →"):link("T01","查看接合後的證明 →"))+'</div>'}
 return s+'</article>'+(e.group==="steps"?sectionNav(e.id):'<aside class="plate"><h3>'+f("繼續審讀")+'</h3>'+["T01","T04","T06","S46"].filter(x=>x!==e.id).map(x=>go(x,"")).join("")+link("lab","有限模型實驗 →")+'</aside>')+'</div>'}
const rules=["染色必屬色業","無表色具有記性","表業唯欲界、初定繫","欲界沒有有覆表"];
function lab(){return '<span class="kicker">MODEL LAB</span><h1>'+f("前提與反例")+'</h1><p class="lead">'+f("在四種色的形態、四種性、七種繫屬之間，Lean 窮舉了 112 筆候選描述。撤去一條規則，看看還有哪些有覆色可以落在初定之外。")+'</p><div class="layout"><section class="panel"><h3>'+f("選擇保留的局部規則")+'</h3>'+rules.map((r,i)=>'<label class="option"><input type="checkbox" checked data-rule="'+i+'"> '+f(r)+'</label>').join("")+'<label class="option"><input type="checkbox" id="other"> '+f("繫地規則改採有餘師：上三定容無覆表")+'</label><div id="labres" aria-live="polite"></div></section><aside class="plate"><h3>'+f("核對 Lean 見證")+'</h3>'+["T08","T09","T10","T20","T21","T22","T23"].map(x=>go(x,"")).join("")+'</aside></div><section class="band" style="margin-top:28px"><h2>'+f("另一項異說：善心現前得幾心？")+'</h2><p>'+f("切換三種讀法；這裡計算各種善心現前位所容得心的聯集。")+'</p><select class="ctrl" id="reading" aria-label="'+f("選擇讀法")+'">'+["《雜心》列舉","《俱舍》增欲善","王路所校《正理》"].map(t=>'<option>'+f(t)+'</option>').join("")+'</select><p id="roster"></p>'+chips(["T14","T15","T16"])+'</section>'}
function labUpdate(){const on=Array.from(document.querySelectorAll("[data-rule]"),x=>x.checked);const other=el("other").checked;el("other").disabled=!on[2];const valid=DATA.model.rows.filter(x=>on.every((b,i)=>!b||x.rules[i===2&&other?4:i])),bad=valid.filter(x=>x.counter);el("labres").className="result "+(bad.length?"bad":"");el("labres").innerHTML='<b>'+f(bad.length?"出現反例":"此組規則推出唯初定繫")+'</b><br>'+f("容許的候選描述")+" "+valid.length+" / 112　·　"+f("反例")+" "+bad.length+(bad.length?'<p>'+f("例")+"　"+f(bad[0].features.join(" · "))+'</p>':'');let m=DATA.model.readings[el("reading").selectedIndex];el("roster").innerHTML="<strong>"+m.length+" "+f("心")+"</strong>　"+f(m.join("、"))}
function render(){let id=location.hash.slice(1)||"home";const page=entries[id];document.documentElement.lang=trad?"zh-Hant":"zh-Hans";el("brand").textContent=trad?"毘曇庫":"毗昙库";el("nav").innerHTML=link("home","證明工作台")+'<a href="./translate/">'+(trad?"命題譯讀":"命题译读")+'</a>'+link("index","研究索引")+link("lab","異說實驗")+'<button id="script">'+(trad?"简体":"繁體")+'</button>';el("script").onclick=()=>{trad=!trad;try{localStorage.setItem("abhi-script",trad?"t":"s")}catch{}render()};el("app").innerHTML=page?detail(page):id==="index"?index():id==="lab"?lab():id==="home"?home():link("home","條目未收錄，返回工作台");el("foot").innerHTML="AbhiLib 0.1　·　Lean 4.19.0　·　<a href='"+repo+"'>GitHub ↗</a>";document.title=(page?(trad?page.title:simple(page.title)):"AbhiLib")+" · "+el("brand").textContent;if(id==="index"){el("search").oninput=el("group").onchange=filter;filter()}if(id==="lab"){el("app").onchange=labUpdate;labUpdate()}else el("app").onchange=null}
window.addEventListener("hashchange",()=>{render();scrollTo(0,0)});render()
</script></body></html>

<script>
const DATA={"entries":{"S01":{"id":"S01","title":"所斷有二種：見所斷、修所斷。","group":"steps","refs":["P04"],"note":"模型內以斷類構造及其互斥性給出。","decl":"本證.s01","code":"theorem s01 : P04 := by intro k h; cases k \u003c;> simp_all [«所斷»]","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L5","axioms":["propext"],"calls":[],"parameters":["P04"]},"S02":{"id":"S02","title":"唯無漏心非所斷。","group":"steps","refs":["P05"],"note":"取「非所斷心必無漏」這個方向。","decl":"本證.s02","code":"theorem s02 (p : P05 w) : P05 w := p","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L6","axioms":[],"calls":["P05"],"parameters":["P05"]},"S03":{"id":"S03","title":"有漏心是所斷。","group":"steps","refs":["S02"],"note":"此處有漏心以非無漏心表示。","decl":"本證.s03","code":"theorem s03 (p : P05 w) (c : w.«心») (h : ¬ w.«無漏心» c) : «所斷» (w.«心斷類» c) := fun e => h (s02 w p c e)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L7","axioms":[],"calls":["P05","S02"],"parameters":["P05"]},"S04":{"id":"S04","title":"有漏心或見所斷，或修所斷。","group":"steps","refs":["S01","S03"],"note":"這條支線到此結束。可檢查長證終點的參數。","decl":"本證.s04","code":"theorem s04 (p : P05 w) (c : w.«心») (h : ¬ w.«無漏心» c) :\n    w.«心斷類» c = .«見所斷» ∨ w.«心斷類» c = .«修所斷» := s01 _ (s03 w p c h)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L8","axioms":["propext"],"calls":["P05","S01","S03"],"parameters":["P05"]},"S05":{"id":"S05","title":"不染心非見所斷。","group":"steps","refs":["P06"],"note":"","decl":"本證.s05","code":"theorem s05 (p : P06 w) : P06 w := p","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L10","axioms":[],"calls":["P06"],"parameters":["P06"]},"S06":{"id":"S06","title":"見所斷心是染。","group":"steps","refs":["S05"],"note":"","decl":"本證.s06","code":"theorem s06 (p : P06 w) (c : w.«心») (h : w.«心斷類» c = .«見所斷») : «染» (w.«心性» c) := by\n  by_cases s : «染» (w.«心性» c)\n  · exact s\n  · exact False.elim (s05 w p c s h)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L11","axioms":[],"calls":["P06","S05"],"parameters":["P06"]},"S07":{"id":"S07","title":"心由相應成善染性。","group":"steps","refs":["P07"],"note":"善心與染心分別帶有相應法見證。此證用到染心的一半。","decl":"本證.s07","code":"theorem s07 (p : P07 w) : P07 w := p","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L15","axioms":[],"calls":["P07"],"parameters":["P07"]},"S08":{"id":"S08","title":"見所斷心與惑相應。","group":"steps","refs":["S06","S07"],"note":"","decl":"本證.s08","code":"theorem s08 (p6 : P06 w) (p7 : P07 w) (c : w.«心») (h : w.«心斷類» c = .«見所斷») :\n    ∃ f, w.«相應» c f ∧ w.«是惑» f := (s07 w p7).1 c (s06 w p6 c h)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L16","axioms":[],"calls":["P06","P07","S07","S06"],"parameters":["P06","P07"]},"S09":{"id":"S09","title":"惑是所斷。","group":"steps","refs":["P16"],"note":"","decl":"本證.s09","code":"theorem s09 (p : P16 w) : P16 w := p","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L18","axioms":[],"calls":["P16"],"parameters":["P16"]},"S10":{"id":"S10","title":"惑有兩種：見所斷惑、修所斷惑。","group":"steps","refs":["S01","S09"],"note":"","decl":"本證.s10","code":"theorem s10 (p : P16 w) (f : w.«心所») (a : w.«是惑» f) :\n    w.«心所斷類» f = .«見所斷» ∨ w.«心所斷類» f = .«修所斷» := s01 _ (s09 w p f a)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L19","axioms":["propext"],"calls":["P16","S01","S09"],"parameters":["P16"]},"S11":{"id":"S11","title":"修所斷惑相應心是修所斷心。","group":"steps","refs":["P03"],"note":"","decl":"本證.s11","code":"theorem s11 (p : P03 w) (c : w.«心») (f : w.«心所») (a : w.«相應» c f) (h : w.«心所斷類» f = .«修所斷») :\n    w.«心斷類» c = .«修所斷» := (p c f a).2.trans h","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L21","axioms":[],"calls":["P03"],"parameters":["P03"]},"S12":{"id":"S12","title":"見所斷心不是修所斷心。","group":"steps","refs":["S01"],"note":"見、修在斷類中互斥。","decl":"本證.s12","code":"theorem s12 (k : «斷類») (h : k = .«見所斷») : k ≠ .«修所斷» := by simp [h]","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L23","axioms":["propext"],"calls":[],"parameters":[]},"S13":{"id":"S13","title":"見所斷心不與修所斷惑相應。","group":"steps","refs":["S11","S12"],"note":"","decl":"本證.s13","code":"theorem s13 (p : P03 w) (c : w.«心») (f : w.«心所») (h : w.«心斷類» c = .«見所斷») (r : w.«心所斷類» f = .«修所斷») :\n    ¬ w.«相應» c f := fun a => s12 _ h (s11 w p c f a r)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L24","axioms":["propext"],"calls":["P03","S12","S11"],"parameters":["P03"]},"S14":{"id":"S14","title":"見所斷心與見所斷惑相應。","group":"steps","refs":["S08","S10","S13"],"note":"另一條證明可直接用前提3將心的斷類移給第8步取得的相應惑。參見 T05。","decl":"本證.s14","code":"theorem s14 (p3 : P03 w) (p6 : P06 w) (p7 : P07 w) (p16 : P16 w) : «見斷心與見斷惑相應» w := by\n  intro c h\n  obtain ⟨f,a,o⟩ := s08 w p6 p7 c h\n  exact ⟨f,a,o,(s10 w p16 f o).resolve_right (fun r => s13 w p3 c f h r a)⟩","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L27","axioms":["propext"],"calls":["P03","P06","P07","P16","S08","S10","S13"],"parameters":["P03","P06","P07","P16"]},"S15":{"id":"S15","title":"見所斷惑唯內門轉。","group":"steps","refs":["P01"],"note":"","decl":"本證.s15","code":"theorem s15 (p : P01 w) : P01 w := p","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L31","axioms":[],"calls":["P01"],"parameters":["P01"]},"S16":{"id":"S16","title":"見所斷心與見所斷惑相應。","group":"steps","refs":["S14"],"note":"重取第14步的結果。實際傳參見長證終點 T01。","decl":"本證.s16","code":"theorem s16 (h : «見斷心與見斷惑相應» w) : «見斷心與見斷惑相應» w := h","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L32","axioms":[],"calls":[],"parameters":[]},"S17":{"id":"S17","title":"相應法同所緣。","group":"steps","refs":["P03"],"note":"","decl":"本證.s17","code":"theorem s17 (p : P03 w) (c : w.«心») (f : w.«心所») (a : w.«相應» c f) : w.«心之所緣» c = w.«心所之所緣» f := (p c f a).1","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L33","axioms":[],"calls":["P03"],"parameters":["P03"]},"S18":{"id":"S18","title":"見所斷心唯緣內門。","group":"steps","refs":["S15","S16","S17"],"note":"透過共同所緣的門向得到心的門向。","decl":"本證.s18","code":"theorem s18 (p1 : P01 w) (p3 : P03 w) (seen : «見斷心與見斷惑相應» w) (c : w.«心») (h : w.«心斷類» c = .«見所斷») :\n    w.«所緣之門» (w.«心之所緣» c) = .«內門» := by\n  obtain ⟨f,a,o,cut⟩ := s16 w seen c h\n  rw [s17 w p3 c f a]; exact s15 w p1 f o cut","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L34","axioms":[],"calls":["P01","P03","S16","S17","S15"],"parameters":["P01","P03"]},"S19":{"id":"S19","title":"見所斷心唯內門轉。","group":"steps","refs":["S18"],"note":"內門轉在此局部模型由所緣的門向定義。","decl":"本證.s19","code":"theorem s19 (p1 : P01 w) (p3 : P03 w) (seen : «見斷心與見斷惑相應» w) (c : w.«心») (h : w.«心斷類» c = .«見所斷») :\n    «內門轉» w c := s18 w p1 p3 seen c h","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L38","axioms":[],"calls":["P01","P03","S18"],"parameters":["P01","P03"]},"S20":{"id":"S20","title":"唯外門轉心能發表業。","group":"steps","refs":["P08"],"note":"","decl":"本證.s20","code":"theorem s20 (p : P08 w) : P08 w := p","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L40","axioms":[],"calls":["P08"],"parameters":["P08"]},"S21":{"id":"S21","title":"內門轉心不能發表業。","group":"steps","refs":["S20"],"note":"","decl":"本證.s21","code":"theorem s21 (p : P08 w) (c : w.«心») (h : «內門轉» w c) : ¬ «能發表» w c :=\n  fun a => «所緣門».noConfusion (h.symm.trans (s20 w p c a))","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L41","axioms":[],"calls":["P08","S20"],"parameters":["P08"]},"S22":{"id":"S22","title":"見所斷心不能發表業。","group":"steps","refs":["S19","S21"],"note":"此處限定親發表業的轉心。《俱舍》長行亦容見所斷識作較遠因等起。","decl":"本證.s22","code":"theorem s22 (p1 : P01 w) (p3 : P03 w) (p8 : P08 w) (seen : «見斷心與見斷惑相應» w) (c : w.«心»)\n    (h : w.«心斷類» c = .«見所斷») : ¬ «能發表» w c := s21 w p8 c (s19 w p1 p3 seen c h)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L43","axioms":[],"calls":["P01","P03","P08","S21","S19"],"parameters":["P01","P03","P08"]},"S23":{"id":"S23","title":"欲界惑唯身見、邊見及彼俱癡有覆無記。","group":"steps","refs":["P09"],"note":"","decl":"本證.s23","code":"theorem s23 (p : P09 w) : P09 w := p","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L45","axioms":[],"calls":["P09"],"parameters":["P09"]},"S24":{"id":"S24","title":"欲界有覆無記心或身見相應，或邊見相應。","group":"steps","refs":["S07","S23"],"note":"從心移到相應惑使用 B01。「彼俱癡」保留與二見同聚的見證。","decl":"本證.s24","code":"theorem s24 (p7 : P07 w) (p9 : P09 w) (b : B01 w) (c : w.«心») (d : w.«心繫屬» c = .«欲界»)\n    (n : w.«心性» c = .«有覆無記») : «與身邊見相應» w c := by\n  obtain ⟨f,a,o⟩ := (s07 w p7).1 c (Or.inr n)\n  obtain ⟨«心所繫屬»,fn⟩ := b c f a o\n  rcases s23 w p9 f o («心所繫屬».trans d) (fn.trans n) with view | «無明»\n  · exact ⟨f,a,view⟩\n  · exact «無明».2 c a","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L46","axioms":[],"calls":["P07","P09","B01","S07","S23"],"parameters":["P07","P09","B01"]},"S25":{"id":"S25","title":"身見、邊見皆見所斷。","group":"steps","refs":["P02"],"note":"","decl":"本證.s25","code":"theorem s25 (p : P02 w) (f : w.«心所») (h : «身邊二見» (w.«心所種類» f)) : w.«心所斷類» f = .«見所斷» := p f (Or.inl h)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L53","axioms":[],"calls":["P02"],"parameters":["P02"]},"S26":{"id":"S26","title":"欲界有覆無記心是見所斷。","group":"steps","refs":["S24","S25"],"note":"從見的斷類轉回心，還用到 P03 的同所斷。","decl":"本證.s26","code":"theorem s26 (p2 : P02 w) (p3 : P03 w) (p7 : P07 w) (p9 : P09 w) (b : B01 w)\n    (c : w.«心») (d : w.«心繫屬» c = .«欲界») (n : w.«心性» c = .«有覆無記») : w.«心斷類» c = .«見所斷» := by\n  obtain ⟨f,a,view⟩ := s24 w p7 p9 b c d n\n  exact (p3 c f a).2.trans (s25 w p2 f view)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L54","axioms":[],"calls":["P02","P03","P07","P09","B01","S24","S25"],"parameters":["P02","P03","P07","P09","B01"]},"S27":{"id":"S27","title":"欲界有覆無記心不能發表業。","group":"steps","refs":["S22","S26"],"note":"","decl":"本證.s27","code":"theorem s27 (seen : ∀ c, w.«心繫屬» c = .«欲界» → w.«心性» c = .«有覆無記» → w.«心斷類» c = .«見所斷»)\n    (block : ∀ c, w.«心斷類» c = .«見所斷» → ¬ «能發表» w c) : «欲界有覆心不能發表» w := fun c d n => block c (seen c d n)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L59","axioms":[],"calls":[],"parameters":[]},"S28":{"id":"S28","title":"欲界表業不是有覆無記心所發。","group":"steps","refs":["S27"],"note":"從表業之地回到親發心之地，使用 B03。","decl":"本證.s28","code":"theorem s28 (block : «欲界有覆心不能發表» w) (b : B03 w) (x : «色法») (m : «表色» x) (d : x.«繫屬» = .«欲界»)\n    (c : w.«心») (n : w.«心性» c = .«有覆無記») : ¬ w.«等起» c x :=\n  fun h => block c ((b c x m h).trans d) n ⟨x,m,h⟩","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L61","axioms":[],"calls":["B03"],"parameters":["B03"]},"S29":{"id":"S29","title":"色由等起成善染性。","group":"steps","refs":["P10"],"note":"","decl":"本證.s29","code":"theorem s29 (p : P10 w) (x : «色法») (a : w.«容許色法» x) (n : «善或染» x.«四性判攝») : «由等起成善染» w x := (p x a n).1","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L64","axioms":[],"calls":["P10"],"parameters":["P10"]},"S30":{"id":"S30","title":"表業是色。","group":"steps","refs":["P11"],"note":"表色是色法的一個子類型。Lean 將此步編為有類型的投影。","decl":"本證.s30","code":"def s30 (x : {r : «色法» // «表色» r}) : «色法» := x.val","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L65","axioms":[],"calls":[],"parameters":[]},"S31":{"id":"S31","title":"表業由等起成善染性。","group":"steps","refs":["S29","S30"],"note":"","decl":"本證.s31","code":"theorem s31 (p : P10 w) (x : {r : «色法» // «表色» r}) (a : w.«容許色法» x.val)\n    (n : «善或染» x.val.«四性判攝») : «由等起成善染» w x.val := s29 w p (s30 x) a n","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L66","axioms":[],"calls":["P10","S29","S30"],"parameters":["P10"]},"S32":{"id":"S32","title":"欲界表業不是有覆無記。","group":"steps","refs":["S28","S31"],"note":"僅知同為染，仍有不善與有覆兩種可能。B02 補足親發心與表業的細分性。","decl":"本證.s32","code":"theorem s32 (block : «欲界有覆心不能發表» w) (b2 : B02 w) (b3 : B03 w) (p : P10 w) (x : «色法»)\n    (a : w.«容許色法» x) (m : «表色» x) (d : x.«繫屬» = .«欲界») : ¬ «有覆無記色» x := by\n  intro cov\n  obtain ⟨c,h,agree⟩ := s31 w p ⟨x,m⟩ a (Or.inr (Or.inr cov))\n  rcases agree with «善» | stained\n  · exact «四性».noConfusion («善».1.symm.trans cov)\n  · exact s28 w block b3 x m d c (b2 c x m h cov stained.2) h","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L68","axioms":[],"calls":["B02","B03","P10","S31","S28"],"parameters":["B02","B03","P10"]},"S33":{"id":"S33","title":"欲界沒有有覆無記表業。","group":"steps","refs":["S32"],"note":"","decl":"本證.s33","code":"theorem s33 (block : «欲界有覆心不能發表» w) (b2 : B02 w) (b3 : B03 w) (p : P10 w) (x : «色法»)\n    (a : w.«容許色法» x) (m : «表色» x) (cov : «有覆無記色» x) : x.«繫屬» ≠ .«欲界» :=\n  fun d => s32 w block b2 b3 p x a m d cov","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L75","axioms":[],"calls":["B02","B03","P10","S32"],"parameters":["B02","B03","P10"]},"S34":{"id":"S34","title":"唯有伺心能發表業。","group":"steps","refs":["P08","P12"],"note":"","decl":"本證.s34","code":"theorem s34 (p8 : P08 w) (p12 : P12 w) (c : w.«心») (a : «能發表» w c) : w.«伺» c := p12 c (p8 c a)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L78","axioms":[],"calls":["P08","P12"],"parameters":["P08","P12"]},"S35":{"id":"S35","title":"第二靜慮以上都無尋、伺。","group":"steps","refs":["P13"],"note":"","decl":"本證.s35","code":"theorem s35 (p : P13 w) : P13 w := p","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L79","axioms":[],"calls":["P13"],"parameters":["P13"]},"S36":{"id":"S36","title":"第二靜慮以上都無表業。","group":"steps","refs":["S34","S35"],"note":"由心及表要用 B03 同地、B04 有直接發心。","decl":"本證.s36","code":"theorem s36 (p8 : P08 w) (p12 : P12 w) (p13 : P13 w) (b3 : B03 w mises","decl":"P11","verse":"俱表無表性／五境及無表","refs":["R10"],"code":"def P11 := ∀ x, «色業» x ↔ «表色» x ∨ x.«種類» = .«無表»","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Core.lean#L75","axioms":[],"calls":[],"parameters":[]},"P12":{"id":"P12","title":"外門轉心必有伺。","group":"premises","decl":"P12","verse":"表唯有伺二","refs":["R10"],"code":"def P12 := ∀ c, «外門轉» w c → w.«伺» c","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Core.lean#L76","axioms":[],"calls":[],"parameters":[]},"P13":{"id":"P13","title":"二定以上都無尋、伺。","group":"premises","decl":"P13","verse":"上兼除伺等／中唯伺上無","refs":["R10"],"code":"def P13 := ∀ c, «高於初靜慮之繫地» (w.«心繫屬» c) → ¬ w.«尋» c ∧ ¬ w.«伺» c","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Core.lean#L77","axioms":[],"calls":[],"parameters":[]},"P14":{"id":"P14","title":"不善、有覆無記是染。","group":"premises","decl":"P14","verse":"善惡覆無覆／染有罪覆劣","refs":["R10"],"code":"def P14 := ∀ n : «四性», n = .«不善» ∨ n = .«有覆無記» → «染» n","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Core.lean#L78","axioms":[],"calls":[],"parameters":[]},"P15":{"id":"P15","title":"無表色是有記性。","group":"premises","decl":"P15","verse":"隨流淨不淨／無表記餘三","refs":["R10"],"code":"def P15 := ∀ x, w.«容許色法» x → x.«種類» = .«無表» → ¬ «無記» x.«四性判攝»","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Core.lean#L79","axioms":[],"calls":[],"parameters":[]},"P16":{"id":"P16","title":"惑是所斷。","group":"premises","decl":"P16","verse":"忍所害隨眠／已說煩惱斷","refs":["R10"],"code":"def P16 := ∀ f, w.«是惑» f → «所斷» (w.«心所斷類» f)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Core.lean#L80","axioms":[],"calls":[],"parameters":[]},"B01":{"id":"B01","title":"相應惑與心同繫地、同四分性。","group":"bridges","decl":"B01","refs":["S24"],"code":"def B01 := ∀ c f, w.«相應» c f → w.«是惑» f → w.«心所繫屬» f = w.«心繫屬» c ∧ w.«心所性» f = w.«心性» c","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Core.lean#L83","axioms":[],"calls":[],"parameters":[]},"B02":{"id":"B02","title":"親發有覆表的染心具有有覆無記性。","group":"bridges","decl":"B02","refs":["S32"],"code":"def B02 := ∀ c x, «表色» x → w.«等起» c x → «有覆無記色» x → «染» (w.«心性» c) → w.«心性» c = .«有覆無記»","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Core.lean#L85","axioms":[],"calls":[],"parameters":[]},"B03":{"id":"B03","title":"表業與親發該表的心同繫地。","group":"bridges","decl":"B03","refs":["S28","S36"],"code":"def B03 := ∀ c x, «表色» x → w.«等起» c x → w.«心繫屬» c = x.«繫屬»","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Core.lean#L87","axioms":[],"calls":[],"parameters":[]},"B04":{"id":"B04","title":"每一容許的表業都有直接發心。","group":"bridges","decl":"B04","refs":["S36"],"code":"def B04 := ∀ x, w.«容許色法» x → «表色» x → ∃ c, w.«等起» c x","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Core.lean#L89","axioms":[],"calls":[],"parameters":[]},"B05":{"id":"B05","title":"表業皆有繫地，排除不繫。","group":"bridges","decl":"B05","refs":["S37"],"code":"def B05 := ∀ x, w.«容許色法» x → «表色» x → x.«繫屬» ≠ .«不繫»","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Core.lean#L91","axioms":[],"calls":[],"parameters":[]},"T01":{"id":"T01","title":"有覆無記色唯初靜慮繫","group":"entries","decl":"本證.有覆無記色唯初靜慮繫","note":"依文章五段接合。P04、P11、P14 由分類定義承擔，P05 只進入第2至4步支線。參數中保留十二個原文前提和五項橋接。","refs":["R01","R02","R03"],"code":"theorem «有覆無記色唯初靜慮繫» (p1 : P01 w) (p2 : P02 w) (p3 : P03 w) (p6 : P06 w) (p7 : P07 w)\n    (p8 : P08 w) (p9 : P09 w) (p10 : P10 w) (p12 : P12 w) (p13 : P13 w) (p15 : P15 w)\n    (p16 : P16 w) (b1 : B01 w) (b2 : B02 w) (b3 : B03 w) (b4 : B04 w) (b5 : B05 w)\n    (x : «色法») (a : w.«容許色法» x) (c : «有覆無記色» x) : x.«繫屬» = .«初靜慮» :=\n  «五段長證» w p1 p2 p3 p7 p8 p9 p10 p12 p13 p15 b1 b2 b3 b4 b5 (s14 w p3 p6 p7 p16) x a c","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L117","axioms":["propext"],"calls":["P01","P02","P03","P06","P07","P08","P09","P10","P12","P13","P15","P16","B01","B02","B03","B04","B05","T24","S14"],"parameters":["P01","P02","P03","P06","P07","P08","P09","P10","P12","P13","P15","P16","B01","B02","B03","B04","B05"]},"T02":{"id":"T02","title":"從「得」到所得法","group":"entries","decl":"分別實驗.由得推所得法","note":"《正理》卷十二直接提到初靜慮染身語表業之得。模型分開記錄每一得的所得法、每一所論色有相應得，以及對文句的逐物解讀。","refs":["R01"],"code":"theorem «由得推所得法» {«得» : Type} («所得法» : «得» → «色法») (x : «色法»)\n    (has : «有覆無記色» x → ∃ d, «所得法» d = x)\n    (reading : ∀ d, «有覆無記色» («所得法» d) → («所得法» d).«繫屬» = .«初靜慮»)\n    (c : «有覆無記色» x) : x.«繫屬» = .«初靜慮» := by\n  obtain ⟨d,h⟩ := has c\n  exact h ▸ reading d (h.symm ▸ c)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Experiments.lean#L44","axioms":[],"calls":[],"parameters":[]},"T03":{"id":"T03","title":"從有覆表的繫地推到有覆色","group":"entries","decl":"分別實驗.由表證色","note":"《正理》卷三十六限定有覆表的繫地，另證有覆無記色屬於表。","refs":["R02","R03"],"code":"theorem «由表證色» (x : «色法») (k : «染色屬業» x) (a : «無表有記» x)\n    (reading : «有覆無記色» x → «表色» x → x.«繫屬» = .«初靜慮») (c : «有覆無記色» x) : x.«繫屬» = .«初靜慮» :=\n  reading c («有覆無記色是表» x k a c)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Experiments.lean#L51","axioms":[],"calls":["T07"],"parameters":[]},"T04":{"id":"T04","title":"省去前提16的完整長證","group":"entries","decl":"本證.省前提十六之長證","note":"其餘前提、五項橋接與目標相同。比較 T01 與本條的參數可以直接看到差別。","refs":["R03"],"code":"theorem «省前提十六之長證» (p1 : P01 w) (p2 : P02 w) (p3 : P03 w) (p6 : P06 w) (p7 : P07 w)\n    (p8 : P08 w) (p9 : P09 w) (p10 : P10 w) (p12 : P12 w) (p13 : P13 w) (p15 : P15 w)\n    (b1 : B01 w) (b2 : B02 w) (b3 : B03 w) (b4 : B04 w) (b5 : B05 w)\n    (x : «色法») (a : w.«容許色法» x) (c : «有覆無記色» x) : x.«繫屬» = .«初靜慮» :=\n  «五段長證» w p1 p2 p3 p7 p8 p9 p10 p12 p13 p15 b1 b2 b3 b4 b5 («由同斷得見斷相應» w p3 p6 p7) x a c","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L128","axioms":[],"calls":["P01","P02","P03","P06","P07","P08","P09","P10","P12","P13","P15","B01","B02","B03","B04","B05","T24","T05"],"parameters":["P01","P02","P03","P06","P07","P08","P09","P10","P12","P13","P15","B01","B02","B03","B04","B05"]},"T05":{"id":"T05","title":"由同所斷直接得到見所斷惑","group":"entries","decl":"本證.由同斷得見斷相應","note":"用第8步取得相應惑，將心的見所斷性由前提3傳給惑。","refs":["R03"],"code":"theorem «由同斷得見斷相應» (p3 : P03 w) (p6 : P06 w) (p7 : P07 w) : «見斷心與見斷惑相應» w := by\n  intro c h\n  obtain ⟨f,«相應»,aff⟩ := s08 w p6 p7 c h\n  exact ⟨f,«相應»,aff,(p3 c f «相應»).2.symm.trans h⟩","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Article.lean#L123","axioms":[],"calls":["P03","P06","P07","S08"],"parameters":["P03","P06","P07"]},"T06":{"id":"T06","title":"長證前提有共同的非空模型","group":"entries","decl":"相容見證.前提相容見證","note":"兩種心聚、一個初定有覆語表同時滿足十六項與五個橋接。這是邏輯上的相容見證。","refs":["R03"],"code":"theorem «前提相容見證» :\n    P01 «示例論域» ∧ P02 «示例論域» ∧ P03 «示例論域» ∧ P04 ∧ P05 «示例論域» ∧ P06 «示例論域» ∧\n    P07 «示例論域» ∧ P08 «示例論域» ∧ P09 «示例論域» ∧ P10 «示例論域» ∧ P11 ∧ P12 «示例論域» ∧\n    P13 «示例論域» ∧ P14 ∧ P15 «示例論域» ∧ P16 «示例論域» ∧ B01 «示例論域» ∧ B02 «示例論域» ∧\n    B03 «示例論域» ∧ B04 «示例論域» ∧ B05 «示例論域» ∧\n    (∃ x, «示例論域».«容許色法» x ∧ «有覆無記色» x) ∧ (∃ c, «示例論域».«心繫屬» c = .«欲界» ∧ «示例論域».«心性» c = .«有覆無記») := by\n  simp [P01, P02, P03, P04, P05, P06, P07, P08, P09, P10, P11, P12, P13, P14, P15,\n    P16, B01, B02, B03, B04, B05, «能發表», «內門轉», «外門轉», «身邊二見», «五見», «善或染»,\n    «染», «所斷», «由等起成善染», «色業», «高於初靜慮之繫地», «欲界或初靜慮», «表色», «有覆無記色», «無記»,\n    «示例論域», «初定有覆語表», Bool.forall_bool, Bool.exists_bool]\n  constructor\n  · exact «本證».s01\n  · intro x _ hx; subst x; rfl","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Witness.lean#L27","axioms":["Quot.sound","propext"],"calls":["P01","P02","P03","P04","P05","P06","P07","P08","P09","P10","P11","P12","P13","P14","P15","P16","B01","B02","B03","B04","B05","S01"],"parameters":["P01","P02","P03","P04","P05","P06","P07","P08","P09","P10","P11","P12","P13","P14","P15","P16","B01","B02","B03","B04","B05"]},"T07":{"id":"T07","title":"有覆無記色是表色","group":"entries","decl":"分別實驗.有覆無記色是表","note":"由染色是業與無表有記排出無表。","refs":["R03"],"code":"theorem «有覆無記色是表» (x : «色法») (k : «染色屬業» x) (a : «無表有記» x) (c : «有覆無記色» x) : «表色» x :=\n  (k (Or.inr c)).resolve_right (fun u => a u (Or.inl c))","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Experiments.lean#L14","axioms":[],"calls":[],"parameters":[]},"T08":{"id":"T08","title":"四條局部規則的短證","group":"entries","decl":"分別實驗.由四規則得初定繫","note":"採用色業、無表、表的繫地、欲界排除四條規則，單條移除的反例列在實驗室。","refs":["R03"],"code":"theorem «由四規則得初定繫» (x : «色法») (k : «染色屬業» x) (a : «無表有記» x) (g : «表業繫地» x) (d : «欲界無有覆表» x) (c : «有覆無記色» x) :\n    x.«繫屬» = .«初靜慮» := (g («有覆無記色是表» x k a c)).resolve_left (d («有覆無記色是表» x k a c) c)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Experiments.lean#L17","axioms":[],"calls":["T07"],"parameters":[]},"T09":{"id":"T09","title":"有餘師亦容同一範圍結論","group":"entries","decl":"分別實驗.有餘師亦唯初定","note":"容許上三靜慮無覆表，仍能排除上地有覆表。","refs":["R03"],"code":"theorem «有餘師亦唯初定» (x : «色法») (k : «染色屬業» x) (a : «無表有記» x) (g : «有餘師表業繫地» x) (d : «欲界無有覆表» x) (c : «有覆無記色» x) :\n    x.«繫屬» = .«初靜慮» := by\n  have m := «有覆無記色是表» x k a c\n  rcases g m with low | «上地»\n  · exact low.resolve_left (d m c)\n  · exact False.elim («四性».noConfusion (c.symm.trans «上地».2))","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Experiments.lean#L20","axioms":[],"calls":["T07"],"parameters":[]},"T10":{"id":"T10","title":"二定無覆語表區別兩說","group":"entries","decl":"分別實驗.二說差例","note":"此候選色滿足有餘師的範圍條件，與前說的表業範圍相衝突。","refs":["R03"],"code":"theorem «二說差例» : ∃ x : «色法», «染色屬業» x ∧ «無表有記» x ∧ «欲界無有覆表» x ∧ «有餘師表業繫地» x ∧ ¬ «表業繫地» x := by\n  exact ⟨⟨.«語表»,.«無覆無記»,.«第二靜慮»⟩, by decide⟩","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Experiments.lean#L27","axioms":[],"calls":[],"parameters":[]},"T11":{"id":"T11","title":"初定繫不足以推出有覆","group":"entries","decl":"分別實驗.初定繫之逆不成","note":"一個初定善語表是逆命題的反例。","refs":["R03"],"code":"theorem «初定繫之逆不成» : ∃ x : «色法», «四規則皆成立» x ∧ x.«繫屬» = .«初靜慮» ∧ ¬ «有覆無記色» x :=\n  ⟨⟨.«語表»,.«善»,.«初靜慮»⟩, by decide⟩","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Experiments.lean#L33","axioms":[],"calls":[],"parameters":[]},"T12":{"id":"T12","title":"容許有覆色的局部模型","group":"entries","decl":"分別實驗.有覆色可存在","note":"具體見證是初定有覆語表。","refs":["R03"],"code":"theorem «有覆色可存在» : ∃ x : «色法», «四規則皆成立» x ∧ «有覆無記色» x := ⟨⟨.«語表»,.«有覆無記»,.«初靜慮»⟩, by decide⟩","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Experiments.lean#L35","axioms":[],"calls":[],"parameters":[]},"T13":{"id":"T13","title":"也有完全不含有覆色的非空模型","group":"entries","decl":"分別實驗.可無有覆色","note":"只納入一個欲界善語表的模型即可。與 T12 合讀可區分範圍與存在。","refs":["R03"],"code":"theorem «可無有覆色» : ∃ W : «色法» → Prop, (∃ x, W x) ∧ (∀ x, W x → «四規則皆成立» x) ∧\n    ¬ ∃ x, W x ∧ «有覆無記色» x := by\n  let s : «色法» := ⟨.«語表»,.«善»,.«欲界»⟩\n  refine ⟨fun x => x = s, ⟨s,rfl⟩, ?_, ?_⟩\n  · intro x h; subst x; decide\n  · rintro ⟨x,h,n⟩; subst x; exact «四性».noConfusion n","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Experiments.lean#L36","axioms":[],"calls":[],"parameters":[]},"T14":{"id":"T14","title":"善心中六與七的三種讀法","group":"entries","decl":"分別實驗.六七心計數","note":"分別計算《雜心》、《俱舍》及王路所校《正理》的善心現前容得心之聯集。","refs":["R05","R06","R07"],"code":"theorem «六七心計數» : («得心名單» false true).length = 6 ∧ («得心名單» true true).length = 7 ∧\n    («得心名單» true false).length = 6 := by decide","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Experiments.lean#L68","axioms":[],"calls":[],"parameters":[]},"T15":{"id":"T15","title":"同得六心，兩張名單的差別","group":"entries","decl":"分別實驗.六心名單之異","note":"欲善、欲無覆在兩種六心說中互換。","refs":["R05","R06","R07"],"code":"theorem «六心名單之異» (m : «十二心») : «容得» false true m ≠ «容得» true false m ↔\n    m = .«欲界善心» ∨ m = .«欲界無覆心» := by cases m \u003c;> decide","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Experiments.lean#L70","axioms":[],"calls":[],"parameters":[]},"T16":{"id":"T16","title":"七心須同取兩個爭議成員","group":"entries","decl":"分別實驗.七心之充要條件","note":"在共同五個成員固定的模型中，七心等價於同時納入欲善與欲無覆。","refs":["R05","R07"],"code":"theorem «七心之充要條件» (a b : Bool) : («得心名單» a b).length = 7 ↔ a = true ∧ b = true := by\n  cases a \u003c;> cases b ,"T31"],"parameters":["H04","H05","H06"]},"T33":{"id":"T33","title":"阿那含成就無漏根本初靜慮","group":"entries","decl":"不還果論.不還者成就無漏初靜慮","note":"不還者為聖者，並已離欲。將這兩個條件代入 T32。所識別的種類是無漏。","refs":["H03","T30","T32"],"code":"theorem «不還者成就無漏初靜慮» (cut : «不還果離欲規則» p) (up : «生第二靜慮以上規則» p)\n    (gone : «生欲梵而梵愛盡規則» p) (remains : «生欲梵而梵愛未盡規則» p)\n    (f : p.«所居位» = .«持果» .«不還果») : p.«成就» .«初靜慮» .«無漏» :=\n  «離欲聖者成就無漏初定» p up gone remains («持果者是聖者» f) (cut f)","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Nonreturn.lean#L40","axioms":["Classical.choice","Quot.sound","propext"],"calls":["H03","H04","H05","H06","T32","T30"],"parameters":["H03","H04","H05","H06"]},"T34":{"id":"T34","title":"阿那含必然成就初靜慮","group":"entries","decl":"不還果論.不還者成就初靜慮","note":"無漏初靜慮即為一個具體見證，故存在其所成就的一種根本初靜慮。結論談當下持有。","refs":["T33","C28"],"code":"theorem «不還者成就初靜慮» (cut : «不還果離欲規則» p) (up : «生第二靜慮以上規則» p)\n    (gone : «生欲梵而梵愛盡規則» p) (remains : «生欲梵而梵愛未盡規則» p)\n    (f : p.«所居位» = .«持果» .«不還果») : «成就根本靜慮» p .«初靜慮» :=\n  ⟨.«無漏», «不還者成就無漏初靜慮» p cut up gone remains f⟩","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Nonreturn.lean#L45","axioms":["Classical.choice","Quot.sound","propext"],"calls":["H03","H04","H05","H06","T33"],"parameters":["H03","H04","H05","H06"]},"T35":{"id":"T35","title":"生梵世上的聖者不成就淨初靜慮","group":"entries","decl":"不還果論.生第二靜慮以上聖者不成就淨初定","note":"在根本等至三分法中，淨專指有漏善。此項可與成就無漏初靜慮同時成立。","refs":["H04","R15"],"code":"theorem «生第二靜慮以上聖者不成就淨初定» (up : «生第二靜慮以上規則» p)\n    (n : «聖者» p.«所居位») (b : ¬ «欲界或梵世» p.«生地») : ¬ p.«成就» .«初靜慮» .«淨» :=\n  (up n b).2.1","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/Nonreturn.lean#L50","axioms":[],"calls":["H04"],"parameters":["H04"]},"T36":{"id":"T36","title":"最後心後無續心，仍可攝於集諦","group":"entries","decl":"命題模型.最後心無後繼亦攝集諦","note":"兩念的有限片段：先有無學道心，末念為欲界威儀心。核對兩條心類規則、集諦歸屬及末念無後繼。這是相容見證。","refs":["H01","H02","H07","R17"],"code":"theorem «最後心無後繼亦攝集諦» :\n    «般涅槃心細類» «最後心模型» ∧ «無覆細類判攝» «最後心模型» ∧ «最後心模型».«般涅槃位» true ∧\n    «攝於» («心之諦攝法類» («最後心模型».«心類» true)) .«集諦» ∧\n    (¬ ∃ b, «後繼» true b) ∧ «攝於» («心之諦攝法類» («最後心模型».«心類» false)) .«道諦» := by\n  refine ⟨?_, ?_, rfl, rfl, ?_, rfl⟩\n  · intro e h\n    change e = true at h\n    subst e\n    exact Or.inl rfl\n  · intro e k h\n    cases e\n    · cases h\n    · rfl\n  · rintro ⟨_, h, _⟩\n    cases h","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/CaseModels.lean#L15","axioms":[],"calls":["H01","H02","H07","H08"],"parameters":["H01","H02","H07"]},"T37":{"id":"T37","title":"必成就初靜慮，不能加強成必成就淨初靜慮","group":"entries","decl":"命題模型.淨初定反例","note":"以生第二靜慮的不還者作局部見證，逐一滿足 H03–H06，同時成就無漏初靜慮而不成就淨初靜慮。","refs":["H03","H04","H05","H06","T35"],"code":"theorem «淨初定反例» :\n    ∃ p : «人位», «不還果離欲規則» p ∧ «生第二靜慮以上規則» p ∧ «生欲梵而梵愛盡規則» p ∧\n      «生欲梵而梵愛未盡規則» p ∧ p.«所居位» = .«持果» .«不還果» ∧\n      p.«成就» .«初靜慮» .«無漏» ∧ ¬ p.«成就» .«初靜慮» .«淨» := by\n  refine ⟨«生第二靜慮不還者», ?_, ?_, ?_, ?_, rfl, Or.inl ⟨rfl, rfl⟩, ?_⟩\n  · intro _; rfl\n  · intro _ _\n    exact ⟨Or.inl ⟨rfl, rfl⟩, by simp [«生第二靜慮不還者»], by simp [«生第二靜慮不還者»]⟩\n  · intro _ h\n    rcases h with h | h \u003c;> cases h\n  · intro _ h\n    rcases h with h | h \u003c;> cases h\n  · simp [«生第二靜慮不還者»]","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/CaseModels.lean#L39","axioms":["propext"],"calls":["H03","H04","H05","H06"],"parameters":["H03","H04","H05","H06"]},"T38":{"id":"T38","title":"有漏心在四諦攝法表中的定位","group":"entries","decl":"最後心論.有漏心歸有漏法","note":"將十二心的有漏分類接到適用於各種法的諦攝表。後續心類命題可直接使用。","refs":["H09","H07"],"code":"theorem «有漏心歸有漏法» (m : «十二心») (h : «有漏» m) :\n    «心之諦攝法類» m = .«有漏» := by simp [«心之諦攝法類», h]","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/LastMind.lean#L31","axioms":["propext"],"calls":["H09"],"parameters":["H09"]},"T39":{"id":"T39","title":"第二題四條文獻輸入的逐條刪除試驗","group":"entries","decl":"命題模型.不還果四前提各自必要","note":"在本模型裡，每撤 H03–H06 中任一條，就能給出滿足其餘三條、持不還果卻不成就根本初靜慮的反模型。它限定這組輸入，並未窮盡其他證明路線。","refs":["H03","H04","H05","H06","T34"],"code":"theorem «不還果四前提各自必要» (dropped : «不還果論前提») :\n    ∃ p : «人位», p.«所居位» = .«持果» .«不還果» ∧\n      (∀ i, i ≠ dropped → «所需前提» p i) ∧ ¬ «成就根本靜慮» p .«初靜慮» := by\n  refine ⟨«撤前提模型» dropped, rfl, ?_, ?_⟩\n  · intro i\n    cases dropped \u003c;> cases i \u003c;>\n      simp [«所需前提», «不還果離欲規則», «生第二靜慮以上規則», «生欲梵而梵愛盡規則», «生欲梵而梵愛未盡規則»,\n        «撤前提模型», «聖者», «欲界或梵世», «已離染»]\n  · rintro ⟨k, h⟩\n    exact h","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/CaseModels.lean#L89","axioms":["Quot.sound","propext"],"calls":[],"parameters":[]},"T40":{"id":"T40","title":"刪去般涅槃心的限制","group":"entries","decl":"命題模型.撤般涅槃心規則","note":"保留心類標記的一致性，撤 H01，則末念標記可落在道心，無法保證攝於集諦。","refs":["H01","H02","T29"],"code":"theorem «撤般涅槃心規則» :\n    ∃ c : «心念論域» Unit, «無覆細類判攝» c ∧ c.«般涅槃位» () ∧\n      ¬ «攝於» («心之諦攝法類» (c.«心類» ())) .«集諦» := by\n  let c : «心念論域» Unit := ⟨fun _ => .«無學心», fun _ => none, fun _ => True⟩\n  refine ⟨c, ?_, True.intro, ?_⟩\n  · intro e k h; cases h\n  · intro h; cases h","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/CaseModels.lean#L55","axioms":[],"calls":["H02","H07","H08"],"parameters":["H02","H07"]},"T41":{"id":"T41","title":"刪去細目與十二心的一致性","group":"entries","decl":"命題模型.撤無覆細類一致性","note":"保留 H01，撤 H02，則模型能把無學道心錯標為威儀路。這項反例指出兩套分類相接時所用的條件。","refs":["H01","H02","T29"],"code":"theorem «撤無覆細類一致性» :\n    ∃ c : «心念論域» Unit, «般涅槃心細類» c ∧ c.«般涅槃位» () ∧\n      ¬ «攝於» («心之諦攝法類» (c.«心類» ())) .«集諦» := by\n  let c : «心念論域» Unit := ⟨fun _ => .«無學心», fun _ => some .«威儀路», fun _ => True⟩\n  exact ⟨c, fun _ _ => Or.inl rfl, True.intro, fun h => by cases h⟩","src":"https://github.com/wanglu2016/abhilib-gpt/blob/main/AbhiLib/CaseModels.lean#L64","axioms":[],"calls":["H01","H07"],"parameters":["H01","H07"]},"R01":{"id":"R01","title":"《阿毘達磨順正理論》卷十二","group":"sources","locator":"T29, no. 1562, 399a09–13","note":"有覆無記色之得，及其所得的初定染表。","url":"https://deerpark.app/cbeta/T1562/12"},"R02":{"id":"R02","title":"《阿毘達磨順正理論》卷三十六","group":"sources","locator":"T29, no. 1562, 545c27–546a03","note":"有覆無記表唯初靜慮中可得說有。","url":"h 》卷一四七","group":"sources","locator":"T27, no. 1545, 755b06–12","note":"就一一有漏事分辨果義與因義，說明苦、集二智所緣可以相同。","url":"https://deerpark.app/cbeta/T1545/147"},"R14":{"id":"R14","title":"《阿毘達磨俱舍論》卷二十四","group":"sources","locator":"T29, no. 1558, 124a14–b04","note":"明欲修惑七、八品與斷第九品的差別，分別不還向與不還果。","url":"https://deerpark.app/cbeta/T1558/24"},"R15":{"id":"R15","title":"《阿毘達磨大毘婆沙論》卷一六二","group":"sources","locator":"T27, no. 1545, 822a13–29、822b01–25","note":"逐問成就根本初靜慮哪些種類，給出生地、欲愛與梵世愛的條件，也說明越地捨淨的理由。","url":"https://deerpark.app/cbeta/T1545/162"},"R16":{"id":"R16","title":"《阿毘達磨大毘婆沙論》卷七十七","group":"sources","locator":"T27, no. 1545, 397a25–b13","note":"列阿毘達磨論師、譬喻者、分別論者的四諦說。分別論者限定集諦於招後有愛。","url":"https://deerpark.app/cbeta/T1545/77"},"R17":{"id":"R17","title":"《阿毘達磨俱舍論》卷七","group":"sources","locator":"T29, no. 1558, 37a10–17","note":"阿羅漢最後心後無餘心續起，故論中排除等無間緣的作用。","url":"https://deerpark.app/cbeta/T1558/7"},"R18":{"id":"R18","title":"《阿毘達磨大毘婆沙論》卷六十七","group":"sources","locator":"T27, no. 1545, 卷六十七開首「諸不還者所成就無漏法」段","note":"無為不還果攝欲界修所斷法斷，並論其已得不失。供核對由持果推已離欲的方向。","url":"https://deerpark.app/cbeta/T1545/67"},"R19":{"id":"R19","title":"《阿毘達磨俱舍論》卷二十二","group":"sources","locator":"T29, no. 1558, 113c19–27","note":"四諦自體回指初品。無漏聖道、擇滅與有漏法分別對應道、滅與苦集。","url":"https://deerpark.app/cbeta/T1558/22"},"C01":{"id":"C01","title":"有覆無記","group":"concepts","note":"染污而無記。建立「同為染」後，仍要區分有覆與不善。","refs":["P14","S32","S40"]},"C02":{"id":"C02","title":"無覆無記","group":"concepts","note":"無記中的無覆一類。上三靜慮表業之爭涉及此類。","refs":["T09","T10"]},"C03":{"id":"C03","title":"染","group":"concepts","note":"本案中的兩種染性為不善、有覆無記。","refs":["P14","S06"]},"C04":{"id":"C04","title":"色法","group":"concepts","note":"色蘊所攝。每件候選色法各帶有形態、性、繫地三項描述。","refs":["S30","R09"]},"C05":{"id":"C05","title":"色業","group":"concepts","note":"據 P10 將善染色歸作業，再以表、無表劃分。","refs":["P10","P11","S45"]},"C06":{"id":"C06","title":"表業","group":"concepts","note":"在此為身表或語表，二者都是色。","refs":["P11","S46"]},"C07":{"id":"C07","title":"無表色","group":"concepts","note":"五根、五境以外的一類色法，本案使用其有記性。","refs":["P15","S42"]},"C08":{"id":"C08","title":"相應","group":"concepts","note":"心與心所之間的關係。P03 只編入同所緣與同所斷。","refs":["P03","B01"]},"C09":{"id":"C09","title":"見所斷","group":"concepts","note":"與修所斷互斥，心及相應惑的斷類相同。","refs":["P03","S14"]},"C10":{"id":"C10","title":"修所斷","group":"concepts","note":"原證以修所斷惑作排除項。","refs":["S11","S13"]},"C11":{"id":"C11","title":"非所斷","group":"concepts","note":"與見、修二斷同列為斷類的第三個構造。","refs":["P04","P05"]},"C12":{"id":"C12","title":"有漏心","group":"concepts","note":"形式化用「非無漏心」表達，再由 P05 判為所斷。","refs":["S02","S03"]},"C13":{"id":"C13","title":"惑","group":"concepts","note":"在心所論域之內，以謂詞標出；另有相應關係連到心。","refs":["P16","S08"]},"C14":{"id":"C14","title":"內門轉","group":"concepts","note":"門向與心的所緣相關，在此模型中與外門互斥。","refs":["S18","S19"]},"C15":{"id":"C15","title":"外門轉","group":"concepts","note":"此為親發表業的必要條件，由 P12 推出有伺。","refs":["P08","P12"]},"C16":{"id":"C16","title":"等起","group":"concepts","note":"本案須區分遠因、親發的轉心及剎那隨轉。","refs":["R04","S22","S32"]},"C17":{"id":"C17","title":"尋與伺","group":"concepts","note":"P13 兼說二者，原證排除上地表只用到無伺。","refs":["P12","P13","S36"]},"C18":{"id":"C18","title":"繫地","group":"concepts","note":"此法所繫的地。B03 談發心與表業兩者的繫地。","refs":["B03","S28"]},"C19":{"id":"C19","title":"初靜慮","group":"concepts","note":"範圍命題保留的一地。初定繫色的性仍可以不同。","refs":["S48","T11"]},"C20":{"id":"C20","title":"不繫","group":"concepts","note":"有漏所繫地外保留的獨立構造。","refs":["B05","S37"]},"C21":{"id":"C21","title":"得","group":"concepts","note":"文證一以得連到所得法。此處未建立得的完整時序理論。","refs":["R01","T02"]},"C22":{"id":"C22","title":"彼俱癡","group":"concepts","note":"與身見或邊見同一心聚；模型保存與二見同聚的見證。","refs":["P09","S24"]},"C23":{"id":"C23","title":"十二心","group":"concepts","note":"得心例保留學與無學為兩項，比較三種成員集合。","refs":["R05","T14","T15"]},"C24":{"id":"C24","title":"欲界中有","group":"concepts","note":"此例只計該中有階段新斷的欲界修惑品數。","refs":["R08","T17","T19"]},"C25":{"id":"C25","title":"般涅槃最後心","group":"concepts","note":"阿羅漢一期相續的最後一念。此心、其所緣及涅槃本身是三個不同的判攝對象。","refs":["H01","T27","T29","R17"]},"C26":{"id":"C26","title":"四諦所攝","group":"concepts","note":"判攝的主詞 function lab(){return '<span class="kicker">MODEL LAB</span><h1>'+f("前提與反例")+'</h1><p class="lead">'+f("在四種色的形態、四種性、七種繫屬之間，Lean 窮舉了 112 筆候選描述。撤去一條規則，看看還有哪些有覆色可以落在初定之外。")+'</p><div class="layout"><section class="panel"><h3>'+f("選擇保留的局部規則")+'</h3>'+rules.map((r,i)=>'<label class="option"><input type="checkbox" checked data-rule="'+i+'"> '+f(r)+'</label>').join("")+'<label class="option"><input type="checkbox" id="other"> '+f("繫地規則改採有餘師：上三定容無覆表")+'</label><div id="labres" aria-live="polite"></div></section><aside class="plate"><h3>'+f("核對 Lean 見證")+'</h3>'+["T08","T09","T10","T20","T21","T22","T23"].map(x=>go(x,"")).join("")+'</aside></div><section class="band" style="margin-top:28px"><h2>'+f("另一項異說：善心現前得幾心？")+'</h2><p>'+f("切換三種讀法；這裡計算各種善心現前位所容得心的聯集。")+'</p><select class="ctrl" id="reading" aria-label="'+f("選擇讀法")+'">'+["《雜心》列舉","《俱舍》增欲善","王路所校《正理》"].map(t=>'<option>'+f(t)+'</option>').join("")+'</select><p id="roster"></p>'+chips(["T14","T15","T16"])+'</section>'}
function labUpdate(){const on=Array.from(document.querySelectorAll("[data-rule]"),x=>x.checked);const other=el("other").checked;el("other").disabled=!on[2];const valid=DATA.model.rows.filter(x=>on.every((b,i)=>!b||x.rules[i===2&&other?4:i])),bad=valid.filter(x=>x.counter);el("labres").className="result "+(bad.length?"bad":"");el("labres").innerHTML='<b>'+f(bad.length?"出現反例":"此組規則推出唯初定繫")+'</b><br>'+f("容許的候選描述")+" "+valid.length+" / 112　·　"+f("反例")+" "+bad.length+(bad.length?'<p>'+f("例")+"　"+f(bad[0].features.join(" · "))+'</p>':'');let m=DATA.model.readings[el("reading").selectedIndex];el("roster").innerHTML="<strong>"+m.length+" "+f("心")+"</strong>　"+f(m.join("、"))}

window.addEventListener("hashchange",()=>{render();scrollTo(0,0)});render()
